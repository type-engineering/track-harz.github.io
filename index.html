<!DOCTYPE html>
<html lang="de" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>trackharz.de — demnächst</title>
  <meta name="description" content="trackharz.de — deine neue Lieblings-Wander-App für den Harz, bald auf Android und iOS." />
  <meta name="theme-color" content="#fdfefd" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fdfefd;
      --green-900: #1f3d27;
      --green-700: #2e7d3a;
      --green-500: #4caf50;
      --green-100: #e3f2e1;
      --muted: #55725b;
    }

    body {
      font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--green-900);
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Text ── */
    .text-block {
      position: relative;
      z-index: 1;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      padding: clamp(1.5rem, 7svh, 4rem) 1.5rem 0;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: var(--green-100);
      color: var(--green-700);
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
    }

    .brand::before {
      content: '';
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--green-500);
    }

    h1 {
      font-size: clamp(1.9rem, 6vw, 3.2rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--green-900);
    }

    .sub {
      font-size: clamp(0.95rem, 2.4vw, 1.1rem);
      font-weight: 600;
      line-height: 1.6;
      color: var(--muted);
      max-width: 36ch;
    }

    /* zero-width anchor: the bar hangs behind the text and does not shift the centering */
    .cursor {
      display: inline-block;
      position: relative;
      width: 0;
      height: 1em;
      vertical-align: baseline;
    }

    .cursor::after {
      content: '';
      position: absolute;
      left: 0.15em;
      bottom: -0.05em;
      width: 0.5em;
      height: 0.9em;
      border-radius: 0.15em;
      background: var(--green-500);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .cursor::after { animation: none; }
    }

    /* ── Carousel, anchored to the bottom ── */
    .hero {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage-wrap {
      position: relative;
      flex: 1 1 0;
      min-height: 16rem;
      width: 100%;
      max-width: 1400px;
    }

    .stage {
      position: absolute;
      inset: 0;
    }

    .arrow {
      position: absolute;
      top: 50%;
      z-index: 2;
      width: 2.8rem;
      height: 2.8rem;
      margin-top: -1.4rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(253, 254, 253, 0.85);
      box-shadow: 0 2px 10px rgba(31, 61, 39, 0.18);
      color: var(--green-700);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .arrow:hover { background: var(--green-100); transform: scale(1.06); }
    .arrow:focus-visible { outline: 2px solid var(--green-700); outline-offset: 3px; }
    .arrow svg { width: 1.3rem; height: 1.3rem; }
    .arrow.prev { left: clamp(0.5rem, 2vw, 1.5rem); }
    .arrow.next { right: clamp(0.5rem, 2vw, 1.5rem); }

    .caption {
      flex: 0 0 auto;
      min-height: 7.5rem;
      max-width: 56ch;
      padding: 0.6rem 1.5rem 0;
      text-align: center;
      transition: opacity 0.25s ease;
    }

    .caption.is-swapping { opacity: 0; }

    .caption h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--green-900);
      margin-bottom: 0.25rem;
    }

    .caption p {
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.5;
      color: var(--muted);
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      opacity: 0;
      transition: opacity 1s ease;
      /* soften the edges so every picture melts into the page */
      -webkit-mask-image:
        linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%),
        linear-gradient(180deg, transparent 0, #000 10%);
      -webkit-mask-composite: source-in;
              mask-image:
        linear-gradient(90deg, transparent 0, #000 8%, #000 92%, transparent 100%),
        linear-gradient(180deg, transparent 0, #000 10%);
              mask-composite: intersect;
    }

    .slide.is-active { opacity: 1; }

    /* without JS: show the first slide of the current orientation */
    .no-js .slide:first-child { opacity: 1; }

    /* tall screens (phones in portrait): content-sized layout, picture keeps its 3:2 ratio */
    @media (max-aspect-ratio: 1/1) {
      body { justify-content: center; }
      .text-block { padding-top: 1.5rem; }
      .hero { flex: 0 0 auto; }
      .stage-wrap { flex: 0 0 auto; min-height: 0; aspect-ratio: 3 / 2; margin-top: 1rem; }
      .arrow { width: 2.4rem; height: 2.4rem; margin-top: -1.2rem; }
      .arrow svg { width: 1.1rem; height: 1.1rem; }
      .caption { min-height: 9.5rem; }
    }

    /* very short screens (landscape phones): keep the picture usable, let the page scroll */
    @media (max-height: 520px) and (min-aspect-ratio: 1/1) {
      .text-block { padding-top: 1rem; gap: 0.5rem; }
      .sub { display: none; }
      .stage-wrap { min-height: 14rem; }
      .caption { min-height: 4.4rem; }
    }

    .dots {
      flex: 0 0 auto;
      display: flex;
      gap: 0.6rem;
      padding: 0.9rem 0 1.1rem;
    }

    .dots button {
      width: 0.7rem;
      height: 0.7rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--green-100);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
    }

    .dots button[aria-current="true"] {
      background: var(--green-500);
      transform: scale(1.25);
    }

    .dots button:focus-visible {
      outline: 2px solid var(--green-700);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .slide, .caption { transition: none; }
    }
  </style>
</head>
<body>
  <div class="text-block">
    <p class="brand">trackharz.de</p>
    <h1>Hier entsteht etwas Neues<span class="cursor" aria-hidden="true"></span></h1>
    <p class="sub">Deine neue Lieblings-Wander-App für den Harz … bald auf Android und iOS.</p>
  </div>

  <div class="hero" aria-roledescription="carousel" aria-label="Eindrücke aus der App">
    <div class="stage-wrap">
      <div class="stage">
        <img class="slide land" src="images/landscape.webp" width="1536" height="1024" fetchpriority="high"
             data-title="Touren planen" data-text="Erstelle und verwalte deine Routen in einem Journal, teile und verändere sie mit Freunden und erwandere sie gemeinsam mit echten Offline-Karten!"
             alt="Illustrierte Harzlandschaft mit Tannen, Karte, Kompass und Wegweiser" />
        <img class="slide land" src="images/watch.webp" width="1536" height="1024"
             data-title="Smartwatch" data-text="Nutze deine Smartwatch mit Google Wear OS (nur Android), deine Apple Watch (nur iOS) oder deine Garmin-Uhr zur Erwanderung deiner Routen."
             alt="Smartwatch mit Harz-Wanderkarte vor Tannen" />
        <img class="slide land" src="images/card.webp" width="1536" height="1024"
             data-title="Fitness" data-text="Wenn du möchtest, werden deine Fitnessdaten als Statistik in der App erfasst. Dabei gehören deine Daten immer dir und werden nie an uns übertragen."
             alt="Infokarte mit Herz auf einem Hügel, links ein Wegweiser" />
        <img class="slide land" src="images/bell.webp" width="1536" height="1024"
             data-title="Immer informiert" data-text="Hinweise zu Unwetter, Regen und Schnee, spezifisch für deine Route!"
             alt="Grüne Glocke zwischen Tannen, daneben ein Wegweiser zum Brocken" />
      </div>
      <button type="button" class="arrow prev" aria-label="Vorheriges Bild">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button type="button" class="arrow next" aria-label="Nächstes Bild">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="caption" aria-live="polite"><h2></h2><p></p></div>
    <div class="dots" role="group" aria-label="Bild auswählen"></div>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      root.classList.remove('no-js');

      var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
      var dotsEl = document.querySelector('.dots');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var INTERVAL = 6000;
      var visible = [], index = 0, timer = null;

      function collect() {
        visible = slides.filter(function (s) { return s.offsetParent !== null; });
        dotsEl.innerHTML = '';
        visible.forEach(function (_, i) {
          var b = document.createElement('button');
          b.type = 'button';
          b.setAttribute('aria-label', 'Bild ' + (i + 1));
          b.addEventListener('click', function () { show(i); restart(); });
          dotsEl.appendChild(b);
        });
      }

      var caption = document.querySelector('.caption');
      var capTitle = caption.querySelector('h2');
      var capText = caption.querySelector('p');
      var capTimeout = null;

      function setCaption(slide, instant) {
        clearTimeout(capTimeout);
        function apply() {
          capTitle.textContent = slide.getAttribute('data-title') || '';
          capText.textContent = slide.getAttribute('data-text') || '';
          caption.classList.remove('is-swapping');
        }
        if (instant || reduce) { apply(); return; }
        caption.classList.add('is-swapping');
        capTimeout = setTimeout(apply, 250);
      }

      function show(i, instant) {
        var n = visible.length;
        index = ((i % n) + n) % n;
        slides.forEach(function (s) { s.classList.remove('is-active'); });
        visible[index].classList.add('is-active');
        setCaption(visible[index], instant);
        Array.prototype.forEach.call(dotsEl.children, function (d, k) {
          d.setAttribute('aria-current', k === index ? 'true' : 'false');
        });
      }

      function go(step) { show(index + step); restart(); }

      document.querySelector('.arrow.prev').addEventListener('click', function () { go(-1); });
      document.querySelector('.arrow.next').addEventListener('click', function () { go(1); });
      document.addEventListener('keydown', function (e) {
        if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
        if (e.key === 'ArrowLeft') go(-1);
        else if (e.key === 'ArrowRight') go(1);
      });

      function restart() {
        clearInterval(timer);
        if (!reduce && !document.hidden) {
          timer = setInterval(function () { show(index + 1); }, INTERVAL);
        }
      }

      function init() { collect(); show(0, true); restart(); }

      document.addEventListener('visibilitychange', restart);
      init();
    })();
  </script>
</body>
</html>
